<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolCraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#79c8f2;font-family:Arial,sans-serif;color:#fff}body{display:grid;place-items:center}.wrap{position:relative;width:min(1100px,100vw)}canvas{width:100%;display:block;image-rendering:pixelated;border:4px solid #263238;box-shadow:0 12px 35px #0008;background:#8fd7ff}.brand{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-weight:900;font-size:22px;letter-spacing:3px;text-shadow:3px 3px #263238;pointer-events:none}.help{position:absolute;top:12px;left:14px;background:#101820d9;border:1px solid #ffffff42;padding:7px 10px;border-radius:5px;font-size:12px;pointer-events:none}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:1px 1px #000}.cross:before{width:2px;height:18px;left:8px}.cross:after{height:2px;width:18px;top:8px}.inventory{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,90%);background:#171717f2;border:4px solid #777;border-radius:4px;padding:18px;box-shadow:0 8px 25px #000b;display:none}.inventory.open{display:block}.inventory h2{margin:0 0 14px;text-align:center;font-size:20px}.inv-layout{display:flex;gap:20px;justify-content:center}.armor{width:155px;border-right:2px solid #555;padding-right:18px}.armor h3{margin:0 0 8px;font-size:14px;text-align:center}.armor-grid,.items{display:grid;grid-template-columns:repeat(2,58px);gap:7px;justify-content:center}.slot{height:52px;background:#3b3b3b;border:2px solid #777;display:grid;place-items:center;position:relative;cursor:pointer;font-size:12px;text-align:center}.slot:hover{border-color:#fff}.slot.selected{border-color:#f5c542}.slot small{position:absolute;right:3px;bottom:2px;font-size:11px}.item-icon{font-size:22px}.close{margin:15px auto 0;display:block;background:#555;color:white;border:2px solid #999;padding:6px 18px;cursor:pointer}.inventory p{text-align:center;color:#ccc;font-size:12px;margin:12px 0 0}.tip{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffffffc9;pointer-events:none}
</style>
</head>
<body>
<div class="wrap"><canvas id="game" width="1100" height="620"></canvas><div class="brand">SCHOOLCRAFT</div><div class="help">WASD / Arrows: move · Space: jump<br>Left click: mine · Right click: place · E: inventory</div><div class="cross"></div><div id="inventory" class="inventory"><h2>Inventory</h2><div class="inv-layout"><div class="armor"><h3>Armor</h3><div id="armorGrid" class="armor-grid"></div></div><div><h3>Items</h3><div id="items" class="items"></div></div></div><p>Click armor to equip or remove it. Press E to close.</p><button class="close" id="close">Close</button></div><div class="tip">1–8 select block</div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),S=32,W=220,H=52,keys={},world=Array.from({length:H},()=>Array(W).fill('air'));const types={grass:['Grass','#55a83d'],dirt:['Dirt','#87552f'],stone:['Stone','#858b91'],wood:['Oak Log','#98602f'],leaves:['Leaves','#2f813b'],sand:['Sand','#d9c37e'],coal:['Coal Ore','#626970'],gold:['Gold Ore','#c89b30']};const slots=['grass','dirt','stone','wood','leaves','sand','coal','gold'];let selected=0,cam=0,time=0,mouse={tx:0,ty:0},inventoryOpen=false;const inv={grass:64,dirt:64,stone:64,wood:32,leaves:32,sand:16,coal:0,gold:0,helmet:1,chestplate:1,leggings:1,boots:1};const armor={helmet:null,chestplate:null,leggings:null,boots:null};const armorNames={helmet:'Helmet',chestplate:'Chestplate',leggings:'Leggings',boots:'Boots'};const armorIcons={helmet:'⛑️',chestplate:'🛡️',leggings:'👖',boots:'👢'};const p={x:8*S,y:5*S,w:23,h:45,vy:0,ground:false};
function heightAt(i){return 20+Math.floor(Math.sin(i*.17)*2+Math.sin(i*.047)*4+Math.cos(i*.31)*1.5)}function rng(i){return Math.abs(Math.sin(i*999.31)*43758.5)%1}for(let i=0;i<W;i++){let g=heightAt(i);for(let j=g;j<H;j++){world[j][i]=j===g?'grass':j<g+5?'dirt':'stone';if(j>g+5&&rng(i*7+j)<.035)world[j][i]=rng(i+j)<.5?'coal':'gold'}if(i>8&&rng(i)<.085){let n=4+Math.floor(rng(i+4)*3);for(let j=1;j<=n;j++)world[g-j][i]='wood';for(let dx=-3;dx<=3;dx++)for(let dy=-3;dy<=2;dy++){let xx=i+dx,yy=g-n+dy;if(xx>=0&&xx<W&&yy>=0&&yy<H&&Math.abs(dx)+Math.abs(dy)<5&&world[yy][xx]==='air')world[yy][xx]='leaves'}}}
function tile(a,b){return a<0||a>=W||b<0||b>=H?'air':world[b][a]}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hit(nx,ny){let a=Math.floor(nx/S)-1,b=Math.floor((nx+p.w)/S)+1,d=Math.floor(ny/S)-1,e=Math.floor((ny+p.h)/S)+1;for(let j=d;j<=e;j++)for(let i=a;i<=b;i++)if(tile(i,j)!=='air'&&overlap({x:nx,y:ny,w:p.w,h:p.h},{x:i*S,y:j*S,w:S,h:S}))return true;return false}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='8')selected=+e.key-1;if(e.key.toLowerCase()==='e'){inventoryOpen=!inventoryOpen;document.getElementById('inventory').classList.toggle('open',inventoryOpen);renderInventory()}if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;mouse.tx=Math.floor((mx+cam)/S);mouse.ty=Math.floor(my/S)});c.oncontextmenu=e=>e.preventDefault();c.onmousedown=e=>{if(inventoryOpen)return;let b=tile(mouse.tx,mouse.ty);if(e.button===0&&b!=='air'){world[mouse.ty][mouse.tx]='air';inv[b]=(inv[b]||0)+1;renderInventory()}if(e.button===2&&b==='air'&&inv[slots[selected]]>0&&!hit(mouse.tx*S,mouse.ty*S)){world[mouse.ty][mouse.tx]=slots[selected];inv[slots[selected]]--;renderInventory()}};
function renderInventory(){let ag=document.getElementById('armorGrid'),items=document.getElementById('items');ag.innerHTML='';items.innerHTML='';Object.keys(armorNames).forEach(k=>{let b=document.createElement('button');b.className='slot';b.innerHTML='<span class="item-icon">'+(armor[k]?armorIcons[k]:'▧')+'</span><small>'+armorNames[k]+'</small>';b.title=armor[k]?'Remove '+armorNames[k]:'Equip '+armorNames[k];b.onclick=()=>{if(armor[k]){inv[k]++;armor[k]=null}else if(inv[k]>0){inv[k]--;armor[k]=k}renderInventory()};ag.appendChild(b)});slots.forEach(k=>{let b=document.createElement('div');b.className='slot';b.innerHTML='<span class="item-icon">'+(k==='grass'?'▦':k==='wood'?'▥':k==='leaves'?'♣':k==='gold'?'◆':'■')+'</span><small>'+types[k][0]+' x'+(inv[k]||0)+'</small>';items.appendChild(b)})}
document.getElementById('close').onclick=()=>{inventoryOpen=false;document.getElementById('inventory').classList.remove('open')};
function update(){if(inventoryOpen)return;let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),nx=p.x+dir*4.7;if(!hit(nx,p.y))p.x=nx;if((keys.w||keys.arrowup||keys[' '])&&p.ground){p.vy=-13;p.ground=false}p.vy=Math.min(15,p.vy+.65);let ny=p.y+p.vy;if(!hit(p.x,ny)){p.y=ny;p.ground=false}else{if(p.vy>0)p.ground=true;p.vy=0}if(p.y>H*S){p.x=8*S;p.y=5*S;p.vy=0}p.x=Math.max(0,Math.min(W*S-p.w,p.x));cam=Math.max(0,Math.min(W*S-c.width,p.x-c.width*.5))}
function block(px,py,t){ctx.fillStyle=types[t][1];ctx.fillRect(px,py,S,S);ctx.globalAlpha=.15;ctx.fillStyle='#fff';for(let q=0;q<4;q++)ctx.fillRect(px+((q*11+px)%25),py+((q*7+py)%24),3,3);ctx.globalAlpha=1;if(t==='grass'){ctx.fillStyle='#8bd354';ctx.fillRect(px,py,S,7);ctx.fillStyle='#39772e';ctx.fillRect(px,py+7,4,S-7)}if(t==='wood'){ctx.strokeStyle='#5e381d';ctx.strokeRect(px+6,py+6,S-12,S-12)}if(t==='coal'||t==='gold'){ctx.fillStyle=t==='gold'?'#f5d45a':'#252b31';for(let q=0;q<4;q++)ctx.fillRect(px+6+(q*9)%18,py+8+(q*13)%17,5,5)}}
function sky(){let day=(Math.sin(time*.00012)+1)/2;ctx.fillStyle=`rgb(${80+day*65},${150+day*70},${215+day*40})`;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle=day>.2?'#ffe27a':'#e5edf5';ctx.beginPath();ctx.arc(850,80,38,0,7);ctx.fill();ctx.fillStyle='#fff9';for(let q=0;q<4;q++){let xx=(q*300+time*.015)%(c.width+180)-90;ctx.beginPath();ctx.arc(xx,105+(q%2)*27,22,0,7);ctx.arc(xx+28,98+(q%2)*27,28,0,7);ctx.arc(xx+60,108+(q%2)*27,20,0,7);ctx.fill()}}
function hud(){ctx.fillStyle='#101820d9';ctx.fillRect(c.width/2-220,c.height-74,440,60);for(let i=0;i<8;i++){let xx=c.width/2-208+i*52;ctx.fillStyle=i===selected?'#f5c542':'#38444dcc';ctx.fillRect(xx,c.height-64,46,46);ctx.strokeStyle=i===selected?'#fff':'#111';ctx.strokeRect(xx,c.height-64,46,46);ctx.fillStyle=types[slots[i]][1];ctx.fillRect(xx+10,c.height-54,26,26);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText(i+1,xx+4,c.height-50);ctx.fillText(String(inv[slots[i]]||0),xx+29,c.height-22)}ctx.fillStyle='#101820d9';ctx.fillRect(18,c.height-74,150,60);ctx.fillStyle='#c62828';ctx.fillRect(30,c.height-59,125,12);ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.fillText('♥ 20 / 20',38,c.height-47);ctx.fillStyle='#d5a52a';ctx.fillRect(30,c.height-37,125,12);ctx.fillStyle='#fff';ctx.fillText('◆ 20 / 20',38,c.height-25)}
function draw(){sky();let a=Math.floor(cam/S)-2,b=a+Math.ceil(c.width/S)+3;for(let j=0;j<H;j++)for(let i=a;i<b;i++){let t=tile(i,j);if(t!=='air')block(i*S-cam,j*S,t)}ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(mouse.tx*S-cam+1,mouse.ty*S+1,S-2,S-2);ctx.fillStyle='#dcecff';ctx.fillRect(p.x-cam,p.y,p.w,p.h);ctx.fillStyle='#315b9e';ctx.fillRect(p.x-cam+4,p.y+9,5,7);ctx.fillRect(p.x-cam+14,p.y+9,5,7);ctx.fillStyle='#20252b';ctx.fillRect(p.x-cam+4,p.y+p.h-9,p.w-8,9);hud()}
function loop(){time++;update();draw();requestAnimationFrame(loop)}renderInventory();loop();
</script>
</body>
</html>

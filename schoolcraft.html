<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolCraft</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}body{display:grid;place-items:center}canvas{width:min(100vw,960px);height:auto;image-rendering:pixelated;border:3px solid #263238;box-shadow:0 8px 30px #0006}.help{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#102033cc;padding:8px 12px;border-radius:8px;font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="help">SchoolCraft · A/D move · W or Space jump · Left click mine · Right click place · 1-5 select</div>
<canvas id="game" width="960" height="540"></canvas>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),S=30,W=160,H=40,keys={},blocks=['grass','dirt','stone','wood','leaves'],colors={grass:'#55a83d',dirt:'#87552f',stone:'#858b91',wood:'#9a642f',leaves:'#32813b'};let world=Array.from({length:H},()=>Array(W).fill('air')),pick=0,cam=0,mouse={tx:0,ty:0};
const p={x:8*S,y:5*S,w:22,h:42,vy:0,ground:false};
function terrain(i){return 17+Math.floor(Math.sin(i*.25)*2+Math.sin(i*.08)*3)}
for(let i=0;i<W;i++){let g=terrain(i);for(let j=g;j<H;j++)world[j][i]=j===g?'grass':j<g+4?'dirt':'stone';if(i>5&&Math.random()<.08){for(let j=1;j<5;j++)world[g-j][i]='wood';for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=1;dy++)if(Math.abs(dx)+Math.abs(dy)<4&&i+dx>=0)world[g-5+dy][i+dx]='leaves'}}
function tile(tx,ty){return tx<0||tx>=W||ty<0||ty>=H?'air':world[ty][tx]}function solid(t){return t!=='air'}function hit(nx,ny){let a=Math.floor(nx/S),b=Math.floor((nx+p.w)/S),d=Math.floor(ny/S),e=Math.floor((ny+p.h)/S);for(let j=d;j<=e;j++)for(let i=a;i<=b;i++)if(solid(tile(i,j)))return true;return false}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='5')pick=+e.key-1;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.tx=Math.floor((e.clientX-r.left)*c.width/r.width/S+cam/S);mouse.ty=Math.floor((e.clientY-r.top)*c.height/r.height/S)});c.oncontextmenu=e=>e.preventDefault();c.onmousedown=e=>{let t=tile(mouse.tx,mouse.ty);if(e.button===0&&t!=='air'){world[mouse.ty][mouse.tx]='air'}if(e.button===2&&t==='air'&&!hit(mouse.tx*S,mouse.ty*S)){world[mouse.ty][mouse.tx]=blocks[pick]}};
function update(){let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);p.x+=dir*4;if(hit(p.x,p.y))p.x-=dir*4;if((keys.w||keys.arrowup||keys[' '])&&p.ground){p.vy=-12;p.ground=false}p.vy=Math.min(p.vy+.6,15);p.y+=p.vy;if(hit(p.x,p.y)){if(p.vy>0)p.ground=true;p.y-=p.vy;p.vy=0}else p.ground=false;if(p.y>H*S){p.x=8*S;p.y=4*S;p.vy=0}cam=Math.max(0,Math.min(p.x-c.width/2,W*S-c.width))}
function draw(){x.fillStyle='#83cff5';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ffe27a';x.beginPath();x.arc(780,80,35,0,7);x.fill();let a=Math.floor(cam/S)-1,b=a+Math.ceil(c.width/S)+2;for(let j=0;j<H;j++)for(let i=a;i<b;i++){let t=tile(i,j);if(t!=='air'){x.fillStyle=colors[t];x.fillRect(i*S-cam,j*S,S,S);x.strokeStyle='#0002';x.strokeRect(i*S-cam,j*S,S,S)}}x.strokeStyle='#fff';x.strokeRect(mouse.tx*S-cam,mouse.ty*S,S,S);x.fillStyle='#e9f1ff';x.fillRect(p.x-cam,p.y,p.w,p.h);x.fillStyle='#285b9e';x.fillRect(p.x-cam+4,p.y+8,5,7);x.fillRect(p.x-cam+14,p.y+8,5,7);x.fillStyle='#17202a';x.fillRect(20,20,250,42);x.fillStyle='#fff';x.font='16px Arial';x.fillText('Selected: '+blocks[pick]+'   Slot: '+(pick+1),32,47);for(let i=0;i<5;i++){x.fillStyle=i===pick?'#ffd54f':'#263238cc';x.fillRect(c.width/2-140+i*58,c.height-55,50,40);x.fillStyle=colors[blocks[i]];x.fillRect(c.width/2-130+i*58,c.height-45,20,20);x.fillStyle='#fff';x.fillText(i+1,c.width/2-105+i*58,c.height-28)}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>

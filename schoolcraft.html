<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolCraft</title>
<style>
:root{--ui:#111827d9;--line:#ffffff42}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#79c8f2;font-family:Arial,sans-serif;color:#fff}body{display:grid;place-items:center}.game-wrap{position:relative;width:min(100vw,1100px);max-height:100vh}.game-wrap canvas{width:100%;height:auto;display:block;image-rendering:pixelated;border:4px solid #263238;box-shadow:0 12px 35px #0008;background:#8fd7ff}.brand{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-weight:900;font-size:22px;letter-spacing:3px;text-shadow:3px 3px #263238;pointer-events:none}.help{position:absolute;top:14px;left:16px;background:var(--ui);border:1px solid var(--line);padding:8px 11px;border-radius:5px;font-size:13px;pointer-events:none}.crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff;box-shadow:1px 1px #000}.crosshair:before{width:2px;height:18px;left:8px}.crosshair:after{height:2px;width:18px;top:8px}.tip{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffffffc9;pointer-events:none}.hidden{display:none}
</style>
</head>
<body>
<div class="game-wrap"><canvas id="game" width="1100" height="620"></canvas><div class="brand">SCHOOLCRAFT</div><div class="help">WASD / Arrows: move &nbsp; Space: jump<br>Left click: mine &nbsp; Right click: place</div><div class="crosshair"></div><div class="tip">1–8 select block</div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),S=32,W=220,H=52,keys={},world=Array.from({length:H},()=>Array(W).fill('air'));
const types={grass:{name:'Grass',base:'#55a83d',top:'#8bd354',side:'#39772e'},dirt:{name:'Dirt',base:'#87552f'},stone:{name:'Stone',base:'#858b91'},wood:{name:'Oak Log',base:'#98602f',top:'#c39154'},leaves:{name:'Leaves',base:'#2f813b'},sand:{name:'Sand',base:'#d9c37e'},coal:{name:'Coal Ore',base:'#626970'},gold:{name:'Gold Ore',base:'#c89b30'}};
const slots=['grass','dirt','stone','wood','leaves','sand','coal','gold'],colors={grass:'#55a83d',dirt:'#87552f',stone:'#858b91',wood:'#98602f',leaves:'#2f813b',sand:'#d9c37e',coal:'#626970',gold:'#c89b30'};let selected=0,cam=0,mouse={tx:0,ty:0},time=0,inv=Object.fromEntries(slots.map((v,i)=>[v,i<5?64:0]));
const p={x:8*S,y:5*S,w:23,h:45,vy:0,ground:false};
function heightAt(i){return 20+Math.floor(Math.sin(i*.17)*2+Math.sin(i*.047)*4+Math.cos(i*.31)*1.5)}
function rng(i){return Math.abs(Math.sin(i*999.31)*43758.5)%1}
for(let i=0;i<W;i++){let g=heightAt(i);for(let j=g;j<H;j++){world[j][i]=j===g?'grass':j<g+5?'dirt':'stone';if(j>g+5&&rng(i*7+j)<.035)world[j][i]=rng(i+j)<.5?'coal':'gold'}if(i>8&&rng(i)<.085){let n=4+Math.floor(rng(i+4)*3);for(let j=1;j<=n;j++)world[g-j][i]='wood';for(let dx=-3;dx<=3;dx++)for(let dy=-3;dy<=2;dy++){let xx=i+dx,yy=g-n+dy;if(xx>=0&&xx<W&&yy>=0&&yy<H&&Math.abs(dx)+Math.abs(dy)<5&&world[yy][xx]==='air')world[yy][xx]='leaves'}}}
function tile(a,b){return a<0||a>=W||b<0||b>=H?'air':world[b][a]}function solid(v){return v!=='air'}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hit(nx,ny){let a=Math.floor(nx/S)-1,b=Math.floor((nx+p.w)/S)+1,d=Math.floor(ny/S)-1,e=Math.floor((ny+p.h)/S)+1;for(let j=d;j<=e;j++)for(let i=a;i<=b;i++)if(solid(tile(i,j))&&overlap({x:nx,y:ny,w:p.w,h:p.h},{x:i*S,y:j*S,w:S,h:S}))return true;return false}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='8'){selected=+e.key-1}if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
canvas.addEventListener('mousemove',e=>{let r=canvas.getBoundingClientRect();let mx=(e.clientX-r.left)*canvas.width/r.width,my=(e.clientY-r.top)*canvas.height/r.height;mouse.tx=Math.floor((mx+cam)/S);mouse.ty=Math.floor(my/S)});canvas.oncontextmenu=e=>e.preventDefault();canvas.onmousedown=e=>{let b=tile(mouse.tx,mouse.ty);if(e.button===0&&b!=='air'){world[mouse.ty][mouse.tx]='air';inv[b]=(inv[b]||0)+1}if(e.button===2&&b==='air'&&inv[slots[selected]]>0&&!hit(mouse.tx*S,mouse.ty*S)){world[mouse.ty][mouse.tx]=slots[selected];inv[slots[selected]]--;}};
function update(){let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let nx=p.x+dir*4.7;if(!hit(nx,p.y))p.x=nx;if((keys.w||keys.arrowup||keys[' '])&&p.ground){p.vy=-13;p.ground=false}p.vy=Math.min(15,p.vy+.65);let ny=p.y+p.vy;if(!hit(p.x,ny)){p.y=ny;p.ground=false}else{if(p.vy>0)p.ground=true;p.vy=0}if(p.y>H*S){p.x=8*S;p.y=5*S;p.vy=0}p.x=Math.max(0,Math.min(W*S-p.w,p.x));cam=Math.max(0,Math.min(W*S-canvas.width,p.x-canvas.width*.5))}
function pixelTexture(px,py,t){ctx.fillStyle=types[t].base;ctx.fillRect(px,py,S,S);let seed=(px/S*17+py/S*31)%7;ctx.globalAlpha=.17;for(let q=0;q<4;q++){ctx.fillStyle=q%2?'#fff':'#000';ctx.fillRect(px+((q*11+seed*3)%26),py+((q*7+seed)%25),3,3)}ctx.globalAlpha=1;if(t==='grass'){ctx.fillStyle=types[t].top;ctx.fillRect(px,py,S,7);ctx.fillStyle=types[t].side;ctx.fillRect(px,py+7,4,S-7)}if(t==='wood'){ctx.strokeStyle='#5e381d';ctx.strokeRect(px+6,py+6,S-12,S-12)}if(t==='coal'||t==='gold'){ctx.fillStyle=t==='gold'?'#f5d45a':'#252b31';for(let q=0;q<4;q++)ctx.fillRect(px+6+((q*9)%18),py+8+((q*13)%17),5,5)}}
function sky(){let cycle=(Math.sin(time*.00012)+1)/2;ctx.fillStyle=`rgb(${80+cycle*65},${150+cycle*70},${215+cycle*40})`;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=cycle>.2?'#ffe27a':'#e5edf5';ctx.beginPath();ctx.arc(850,80,38,0,7);ctx.fill();ctx.fillStyle='#fff9';for(let q=0;q<4;q++){let xx=(q*300+time*.015)%(canvas.width+180)-90;ctx.beginPath();ctx.arc(xx,105+(q%2)*27,22,0,7);ctx.arc(xx+28,98+(q%2)*27,28,0,7);ctx.arc(xx+60,108+(q%2)*27,20,0,7);ctx.fill()}}
function hud(){ctx.fillStyle='#101820c9';ctx.fillRect(canvas.width/2-220,canvas.height-74,440,60);for(let i=0;i<8;i++){let xx=canvas.width/2-208+i*52;ctx.fillStyle=i===selected?'#f5c542':'#38444dcc';ctx.fillRect(xx,canvas.height-64,46,46);ctx.strokeStyle=i===selected?'#fff':'#111';ctx.lineWidth=2;ctx.strokeRect(xx,canvas.height-64,46,46);ctx.fillStyle=colors[slots[i]];ctx.fillRect(xx+10,canvas.height-54,26,26);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText(String(i+1),xx+4,canvas.height-50);ctx.fillText(String(inv[slots[i]]||0),xx+29,canvas.height-22)}ctx.fillStyle='#101820c9';ctx.fillRect(18,canvas.height-74,150,60);ctx.fillStyle='#c62828';ctx.fillRect(30,canvas.height-59,125,12);ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.fillText('♥ 20 / 20',38,canvas.height-47);ctx.fillStyle='#d5a52a';ctx.fillRect(30,canvas.height-37,125,12);ctx.fillStyle='#fff';ctx.fillText('◆ 20 / 20',38,canvas.height-25)}
function draw(){sky();let a=Math.floor(cam/S)-2,b=a+Math.ceil(canvas.width/S)+3;for(let j=0;j<H;j++)for(let i=a;i<b;i++){let t=tile(i,j);if(t!=='air')pixelTexture(i*S-cam,j*S,t)}ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(mouse.tx*S-cam+1,mouse.ty*S+1,S-2,S-2);ctx.fillStyle='#dcecff';ctx.fillRect(p.x-cam,p.y,p.w,p.h);ctx.fillStyle='#315b9e';ctx.fillRect(p.x-cam+4,p.y+9,5,7);ctx.fillRect(p.x-cam+14,p.y+9,5,7);ctx.fillStyle='#20252b';ctx.fillRect(p.x-cam+4,p.y+p.h-9,p.w-8,9);hud()}
function loop(){time++;update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>

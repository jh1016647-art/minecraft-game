<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolCraft</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #80cafa; font-family: Arial, sans-serif; color: #fff;
  }
  body { display: grid; place-items: center; }
  .wrap { position: relative; width: min(1100px, 100vw); }
  canvas {
    width: 100%; display: block; border: 4px solid #263238;
    image-rendering: pixelated; box-shadow: 0 12px 35px #0008;
    background: #8fd7ff;
  }
  .brand {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-weight: 900; letter-spacing: 3px; font-size: 22px; text-shadow: 3px 3px #263238;
  }
  .help {
    position: absolute; top: 12px; left: 14px; background: #101820d9; padding: 7px 10px;
    border-radius: 5px; font-size: 12px;
  }
  .cross {
    position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .cross:before, .cross:after { content: ""; position: absolute; background: #fff; box-shadow: 1px 1px #000; }
  .cross:before { width: 2px; height: 18px; left: 8px; }
  .cross:after { height: 2px; width: 18px; top: 8px; }
  .panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(650px, 92%); max-height: 80%; overflow: auto; background: #171717f5;
    border: 4px solid #777; padding: 16px; display: none; box-shadow: 0 8px 25px #000b;
  }
  .panel.open { display: block; }
  .panel h2 { text-align: center; margin: 0 0 12px; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .tabs button, .close, .save-profile, .profile-btn { background: #555; color: #fff; border: 2px solid #999; padding: 6px 12px; cursor: pointer; }
  .tabs button.active { border-color: #ffd34e; background: #6b5220; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
  .slot {
    height: 62px; background: #3b3b3b; border: 2px solid #777; color: white;
    position: relative; cursor: pointer; font-size: 12px;
  }
  .slot:hover { border-color: #fff; }
  .icon { display: block; font-size: 22px; }
  .count { position: absolute; right: 4px; bottom: 2px; }
  .panel p { text-align: center; color: #ccc; font-size: 12px; }
  .close, .save-profile { display: block; margin: 12px auto 0; }

  .loading-screen {
    position: fixed; inset: 0; z-index: 1000;
    background: linear-gradient(rgba(28, 28, 28, 0.52), rgba(8, 8, 8, 0.62)), repeating-linear-gradient(to bottom, rgba(0,0,0,0.08), rgba(0,0,0,0.08) 4px, rgba(255,255,255,0.02) 4px, rgba(255,255,255,0.02) 8px);
    display: grid; place-items: center; transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-box { width: min(760px, 90vw); text-align: center; color: #f7f7f7; }
  .minecraft-title { font-weight: 900; letter-spacing: 10px; font-size: clamp(32px, 6vw, 78px); color: #d7d7d7; text-shadow: 4px 4px #000, 0 0 20px rgba(255,255,255,0.15); margin-bottom: 14px; }
  .schoolcraft-title { font-weight: 900; letter-spacing: 6px; font-size: clamp(18px, 2.4vw, 42px); color: #e5d4a3; text-shadow: 3px 3px #2e2e2e, 0 0 10px rgba(255,255,255,0.12); margin-bottom: 18px; }
  .loading-bar { width: 100%; height: 22px; border: 3px solid #d9d9d9; background: rgba(0,0,0,0.55); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.65), 0 0 0 2px rgba(255,255,255,0.15); overflow: hidden; margin: 22px auto 12px; }
  .loading-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #5dbb61, #8deb7d, #d7ffd0); box-shadow: inset 0 0 7px rgba(255,255,255,0.45); transition: width 0.2s ease; }
  .loading-text { letter-spacing: 2px; font-size: 13px; text-transform: uppercase; color: #e8e8e8; }

  .profile-box {
    position: fixed; inset: 0; z-index: 900; display: none; place-items: center;
    background: rgba(0,0,0,0.58);
  }
  .profile-box.open { display: grid; }
  .profile-panel {
    width: min(560px, 92vw); background: #1a1f26; border: 4px solid #7a7a7a; box-shadow: 0 14px 35px rgba(0,0,0,.55);
    padding: 20px; border-radius: 5px; color: #fff;
  }
  .profile-panel h3 { margin: 0 0 12px; text-align: center; font-size: 28px; }
  .profile-form { display: grid; gap: 12px; }
  .profile-form label { font-size: 13px; letter-spacing: 1px; color: #cfd9e6; }
  .profile-form input {
    width: 100%; padding: 10px 12px; border: 2px solid #7d8ea3; background: #0d1117; color: #fff; font-size: 14px;
  }
  .skin-grid {
    display: grid; grid-template-columns: repeat(2, minmax(140px, 1fr)); gap: 10px; margin-top: 8px;
  }
  .skin-option {
    display: flex; align-items: center; gap: 10px; border: 2px solid #7a7a7a; background: #2f3843; padding: 8px 10px; cursor: pointer; color: white;
  }
  .skin-option.active { border-color: #ffd34e; background: #56491d; }
  .skin-preview { width: 28px; height: 28px; border: 2px solid #2a2a2a; }
  .profile-actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .profile-btn { padding: 9px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="1100" height="620"></canvas>
  <div class="brand">SCHOOLCRAFT</div>
  <div class="help">WASD / Arrows: move · Space: jump<br>Left click: mine/use tool · Right click: place · E: inventory · P: profile</div>
  <div class="cross"></div>
  <div id="panel" class="panel">
    <h2>Inventory & Crafting</h2>
    <div class="tabs">
      <button data-tab="blocks" class="active">Blocks</button>
      <button data-tab="tools">Tools</button>
      <button data-tab="items">Items</button>
      <button data-tab="armor">Armor</button>
    </div>
    <div id="grid" class="grid"></div>
    <p>Click an item to select it. Tools mine faster. Press E to close.</p>
    <button class="close" id="close">Close</button>
  </div>
</div>

<div id="loadingScreen" class="loading-screen">
  <div class="loading-box">
    <div class="minecraft-title">Minecraft</div>
    <div class="schoolcraft-title">SchoolCraft</div>
    <div class="loading-bar"><div id="loadingFill" class="loading-fill"></div></div>
    <div id="loadingText" class="loading-text">Loading world...</div>
  </div>
</div>

<div id="profileBox" class="profile-box">
  <div class="profile-panel">
    <h3>Player Profile</h3>
    <div class="profile-form">
      <div>
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="you@example.com">
      </div>
      <div>
        <label for="nameInput">Character Name</label>
        <input id="nameInput" type="text" maxlength="18" placeholder="Name">
      </div>
      <div>
        <label>Choose Skin</label>
        <div id="skinGrid" class="skin-grid"></div>
      </div>
    </div>
    <div class="profile-actions">
      <button id="saveProfile" class="save-profile">Save Profile</button>
      <button id="closeProfile" class="profile-btn">Close</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'schoolcraftProfileV1';
const defaultProfile = { email: '', name: 'Player', skin: 'steve' };
const skinStyles = {
  steve: { label: 'Steve', face: '#f0c39a', shirt: '#4f7dc2', pants: '#3b5d8b', accent: '#2a2a2a' },
  alex: { label: 'Alex', face: '#f0c39a', shirt: '#a467d7', pants: '#5a6ca8', accent: '#2d2d2d' },
  cyan: { label: 'Cyan', face: '#f0c39a', shirt: '#56e0d9', pants: '#2c7c8d', accent: '#1e4d58' },
  gold: { label: 'Gold', face: '#f2d89b', shirt: '#ebba4d', pants: '#8d6b2f', accent: '#49391c' },
  dark: { label: 'Dark', face: '#d9b38c', shirt: '#4b4b4b', pants: '#232323', accent: '#0a0a0a' },
  rose: { label: 'Rose', face: '#f4d4b6', shirt: '#f77ca8', pants: '#9e4d6f', accent: '#3d1d2f' }
};

let profile = Object.assign({}, defaultProfile, JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'));

function saveProfileToStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
}

function openProfilePanel() {
  const emailInput = document.getElementById('emailInput');
  const nameInput = document.getElementById('nameInput');
  emailInput.value = profile.email || '';
  nameInput.value = profile.name || 'Player';
  renderSkinChoices();
  document.getElementById('profileBox').classList.add('open');
}

function closeProfilePanel() {
  document.getElementById('profileBox').classList.remove('open');
}

function renderSkinChoices() {
  const grid = document.getElementById('skinGrid');
  grid.innerHTML = '';
  Object.entries(skinStyles).forEach(([key, skin]) => {
    const btn = document.createElement('button');
    btn.className = 'skin-option' + (profile.skin === key ? ' active' : '');
    btn.type = 'button';
    btn.innerHTML = '<span class="skin-preview" style="background: linear-gradient(180deg,' + skin.face + ' 40%, ' + skin.shirt + ' 40%, ' + skin.shirt + ' 62%, ' + skin.pants + ' 62%);"></span><span>' + skin.label + '</span>';
    btn.onclick = () => {
      profile.skin = key;
      renderSkinChoices();
    };
    grid.appendChild(btn);
  });
}

document.getElementById('saveProfile').onclick = () => {
  const emailInput = document.getElementById('emailInput');
  const nameInput = document.getElementById('nameInput');
  profile.email = emailInput.value.trim();
  profile.name = nameInput.value.trim() || 'Player';
  saveProfileToStorage();
  closeProfilePanel();
};
document.getElementById('closeProfile').onclick = closeProfilePanel;

const c = document.getElementById('game');
const ctx = c.getContext('2d');
const S = 32, W = 220, H = 52, keys = {}, world = Array.from({ length: H }, () => Array(W).fill('air'));
const loadingFill = document.getElementById('loadingFill');
const loadingText = document.getElementById('loadingText');
const loadingScreen = document.getElementById('loadingScreen');
const loadingStages = ['Generating terrain', 'Building caves', 'Spawning mobs', 'Loading item set', 'Ready'];
let loadingProgress = 0;

setInterval(() => {
  if (loadingProgress >= 100) return;
  loadingProgress += Math.random() * 16 + 11;
  if (loadingProgress > 100) loadingProgress = 100;
  loadingFill.style.width = loadingProgress + '%';
  const stage = Math.min(loadingStages.length - 1, Math.floor((loadingProgress / 100) * loadingStages.length));
  loadingText.textContent = loadingStages[stage] + '...';
  if (loadingProgress >= 100) {
    loadingText.textContent = 'Ready';
    setTimeout(() => loadingScreen.classList.add('hidden'), 450);
    setTimeout(() => {
      if (!profile.email && !profile.name) openProfilePanel();
      else if (!profile.email || !profile.name || !profile.skin) openProfilePanel();
    }, 600);
  }
}, 220);

const data = {
  grass:['Grass','#55a83d','block'],dirt:['Dirt','#87552f','block'],stone:['Stone','#858b91','block'],cobblestone:['Cobblestone','#687078','block'],wood:['Oak Log','#98602f','block'],planks:['Oak Planks','#b4773b','block'],leaves:['Leaves','#2f813b','block'],sand:['Sand','#d9c37e','block'],glass:['Glass','#a9e9ef','block'],brick:['Bricks','#a94b3e','block'],coal_ore:['Coal Ore','#414950','block'],iron_ore:['Iron Ore','#9e8d7d','block'],gold_ore:['Gold Ore','#c89b30','block'],diamond_ore:['Diamond Ore','#42d6d0','block'],la_peace_ore:['La Peace Ore','#41f3e8','block'],bedrock:['Bedrock','#25252a','block'],
  wooden_pickaxe:['Wood Pickaxe','#9a6b3f','tool'],stone_pickaxe:['Stone Pickaxe','#aeb5ba','tool'],iron_pickaxe:['Iron Pickaxe','#d8dce0','tool'],diamond_pickaxe:['Diamond Pickaxe','#36d6d0','tool'],la_peace_pickaxe:['La Peace Pickaxe','#3cf0e2','tool'],wooden_axe:['Wood Axe','#9a6b3f','tool'],stone_axe:['Stone Axe','#aeb5ba','tool'],iron_axe:['Iron Axe','#d8dce0','tool'],diamond_axe:['Diamond Axe','#36d6d0','tool'],la_peace_axe:['La Peace Axe','#3cf0e2','tool'],wooden_shovel:['Wood Shovel','#9a6b3f','tool'],stone_shovel:['Stone Shovel','#aeb5ba','tool'],iron_shovel:['Iron Shovel','#d8dce0','tool'],diamond_shovel:['Diamond Shovel','#36d6d0','tool'],la_peace_shovel:['La Peace Shovel','#3cf0e2','tool'],wooden_sword:['Wood Sword','#9a6b3f','tool'],stone_sword:['Stone Sword','#aeb5ba','tool'],iron_sword:['Iron Sword','#d8dce0','tool'],diamond_sword:['Diamond Sword','#36d6d0','tool'],la_peace_sword:['La Peace Sword','#3cf0e2','tool'],bow:['Bow','#9a6b3f','tool'],fishing_rod:['Fishing Rod','#80552b','tool'],
  apple:['Apple','#df3b32','item'],bread:['Bread','#d9a441','item'],coal:['Coal','#20252b','item'],iron_ingot:['Iron Ingot','#d8dce0','item'],gold_ingot:['Gold Ingot','#f4cd4e','item'],diamond:['Diamond','#45e0dc','item'],la_peace:['La Peace','#58f4ea','item'],stick:['Stick','#b67b45','item'],torch:['Torch','#ffbf38','item'],bucket:['Bucket','#b9c5cc','item'],arrow:['Arrow','#d0b995','item'],
  helmet:['Iron Helmet','#cbd3d8','armor'],chestplate:['Iron Chestplate','#cbd3d8','armor'],leggings:['Iron Leggings','#cbd3d8','armor'],boots:['Iron Boots','#cbd3d8','armor'],
  cyan_diamond_armor_helmet:['La Peace Helmet','#59ecf8','armor'],cyan_diamond_armor_chestplate:['La Peace Chestplate','#59ecf8','armor'],cyan_diamond_armor_leggings:['La Peace Leggings','#59ecf8','armor'],cyan_diamond_armor_boots:['La Peace Boots','#59ecf8','armor']
};
const blockSlots=['grass','dirt','stone','cobblestone','wood','planks','leaves','sand','glass','brick','coal_ore','iron_ore','gold_ore','diamond_ore','la_peace_ore','bedrock'];
const toolSlots=['wooden_pickaxe','stone_pickaxe','iron_pickaxe','diamond_pickaxe','la_peace_pickaxe','wooden_axe','stone_axe','iron_axe','diamond_axe','la_peace_axe','wooden_shovel','stone_shovel','iron_shovel','diamond_shovel','la_peace_shovel','wooden_sword','stone_sword','iron_sword','diamond_sword','la_peace_sword','bow','fishing_rod'];
const itemSlots=['apple','bread','coal','iron_ingot','gold_ingot','diamond','la_peace','stick','torch','bucket','arrow'];
const armorSlots=['helmet','chestplate','leggings','boots','cyan_diamond_armor_helmet','cyan_diamond_armor_chestplate','cyan_diamond_armor_leggings','cyan_diamond_armor_boots'];
const inv = {};
[...blockSlots,...toolSlots,...itemSlots,...armorSlots].forEach(k => inv[k] = 0);
['grass','dirt','stone','wood','planks','leaves'].forEach(k => inv[k] = 64);
['wooden_pickaxe','wooden_axe','wooden_shovel','wooden_sword','stick','apple','bread'].forEach(k => inv[k] = 4);
inv.iron_ingot = 8; inv.coal = 12; inv.torch = 16; inv.arrow = 16; inv.la_peace = 2; inv.cyan_diamond_armor_helmet = 1;
let selected='grass', tab='blocks', panelOpen=false, cam=0, time=0, mouse={ tx:0, ty:0 };
const p={ x:8*S, y:5*S, w:23, h:45, vy:0, ground:false, health:100 };
const mobs=[];

function h(i){ return 20 + Math.floor(Math.sin(i*.17)*2 + Math.sin(i*.047)*4 + Math.cos(i*.31)*1.5); }
function r(i){ return Math.abs(Math.sin(i*999.31)*43758.5)%1; }
for (let i = 0; i < W; i++) {
  const g = h(i);
  for (let j = g; j < H; j++) {
    world[j][i] = j === g ? 'grass' : j < g + 5 ? 'dirt' : j === H - 1 ? 'bedrock' : 'stone';
    if (j > g + 5 && r(i * 7 + j) < .035) {
      const ore = r(i + j);
      world[j][i] = ore < .25 ? 'coal_ore' : ore < .5 ? 'iron_ore' : ore < .72 ? 'gold_ore' : ore < .9 ? 'diamond_ore' : 'la_peace_ore';
    }
  }
  if (i > 8 && r(i) < .08) {
    const n = 4 + Math.floor(r(i + 4) * 3);
    for (let j = 1; j <= n; j++) world[g - j][i] = 'wood';
    for (let dx = -3; dx <= 3; dx++) {
      for (let dy = -3; dy <= 2; dy++) {
        const xx = i + dx; const yy = g - n + dy;
        if (xx >= 0 && xx < W && yy >= 0 && yy < H && Math.abs(dx) + Math.abs(dy) < 5 && world[yy][xx] === 'air') world[yy][xx] = 'leaves';
      }
    }
  }
}
function spawnMegalodon(x, y){ mobs.push({ x, y, w:72, h:30, baseY:y, dir:1, vx:1.4, hp:30, damage:8, attackCooldown:0, phase:Math.random()*1000 }); }
for (let i = 0; i < 3; i++) spawnMegalodon(90 * S + i * 55 * S, 18 * S + Math.random() * 2 * S);
function rectHit(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function tile(a, b){ return a < 0 || a >= W || b < 0 || b >= H ? 'air' : world[b][a]; }
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function hit(nx, ny){
  const a = Math.floor(nx / S) - 1; const b = Math.floor((nx + p.w) / S) + 1; const d = Math.floor(ny / S) - 1; const e = Math.floor((ny + p.h) / S) + 1;
  for (let j = d; j <= e; j++) {
    for (let i = a; i <= b; i++) {
      if (tile(i, j) !== 'air' && overlap({ x:nx, y:ny, w:p.w, h:p.h }, { x:i*S, y:j*S, w:S, h:S })) return true;
    }
  }
  return false;
}
function icon(k){ if (k.includes('pickaxe')) return '⛏'; if (k.includes('axe')) return '🪓'; if (k.includes('shovel')) return '▱'; if (k.includes('sword')) return '⚔'; if (k === 'bow') return '🏹'; if (k === 'fishing_rod') return '��'; if (k === 'apple') return '🍎'; if (k === 'bread') return '🍞'; if (k === 'bucket') return '🪣'; if (k === 'torch') return '🔥'; if (k === 'diamond') return '◆'; if (k === 'la_peace') return '✦'; if (k.includes('helmet') || k.includes('chestplate') || k.includes('leggings') || k.includes('boots')) return '🛡'; if (k === 'stick') return '│'; return '■'; }
function renderInventory(){
  const g = document.getElementById('grid'); g.innerHTML = '';
  const list = tab === 'blocks' ? blockSlots : tab === 'tools' ? toolSlots : tab === 'items' ? itemSlots : armorSlots;
  list.forEach(k => {
    const b = document.createElement('button');
    b.className = 'slot'; b.innerHTML = '<span class="icon">' + icon(k) + '</span>' + data[k][0] + '<span class="count">x' + (inv[k] || 0) + '</span>';
    b.onclick = () => { selected = k; renderInventory(); };
    if (selected === k) b.style.borderColor = '#ffd34e';
    g.appendChild(b);
  });
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
    btn.onclick = () => { tab = btn.dataset.tab; renderInventory(); };
  });
}
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = 1;
  if (e.key.toLowerCase() === 'e') { panelOpen = !panelOpen; document.getElementById('panel').classList.toggle('open', panelOpen); renderInventory(); }
  if (e.key.toLowerCase() === 'p') openProfilePanel();
  if (e.key === ' ') e.preventDefault();
  const n = Number(e.key); if (n >= 1 && n <= 9) selected = blockSlots[n - 1] || selected;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = 0);
document.getElementById('close').onclick = () => { panelOpen = false; document.getElementById('panel').classList.remove('open'); };
c.oncontextmenu = e => e.preventDefault();
c.onmousemove = e => {
  const rect = c.getBoundingClientRect(); const mx = (e.clientX - rect.left) * c.width / rect.width; const my = (e.clientY - rect.top) * c.height / rect.height;
  mouse.tx = Math.floor((mx + cam) / S); mouse.ty = Math.floor(my / S);
};
c.onmousedown = e => {
  if (panelOpen) return;
  const b = tile(mouse.tx, mouse.ty);
  if (e.button === 0 && b !== 'air') {
    world[mouse.ty][mouse.tx] = 'air';
    const drop = b.endsWith('_ore') ? b.replace('_ore', '') : b;
    inv[drop] = (inv[drop] || 0) + 1;
    if (drop === 'la_peace') inv.la_peace = (inv.la_peace || 0) + 1;
    renderInventory();
  }
  if (e.button === 2 && data[selected]?.[2] === 'block' && inv[selected] > 0 && b === 'air' && !hit(mouse.tx * S, mouse.ty * S)) {
    world[mouse.ty][mouse.tx] = selected; inv[selected]--; renderInventory();
  }
};
function update(){
  if (panelOpen) return;
  let dir = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let nx = p.x + dir * 4.7; if (!hit(nx, p.y)) p.x = nx;
  if ((keys.w || keys.arrowup || keys[' ']) && p.ground) { p.vy = -13; p.ground = false; }
  p.vy = Math.min(15, p.vy + .65);
  let ny = p.y + p.vy; if (!hit(p.x, ny)) { p.y = ny; p.ground = false; } else { if (p.vy > 0) p.ground = true; p.vy = 0; }
  if (p.y > H * S) { p.x = 8 * S; p.y = 5 * S; p.vy = 0; }
  p.x = Math.max(0, Math.min(W * S - p.w, p.x)); cam = Math.max(0, Math.min(W * S - c.width, p.x - c.width * .5));
  for (const m of mobs) {
    m.attackCooldown = Math.max(0, m.attackCooldown - 1);
    const dx = p.x + p.w / 2 - (m.x + m.w / 2);
    if (Math.abs(dx) < 340) { m.dir = dx < 0 ? -1 : 1; m.x += m.dir * m.vx; }
    m.y = m.baseY + Math.sin(time * 0.06 + m.phase) * 12;
    if (rectHit(m, { x:p.x, y:p.y, w:p.w, h:p.h }) && m.attackCooldown === 0) {
      p.health = Math.max(0, p.health - m.damage); m.attackCooldown = 45;
      if (p.health <= 0) { p.health = 100; p.x = 8 * S; p.y = 5 * S; }
    }
  }
}
function drawBlock(px, py, t){
  ctx.fillStyle = data[t][1]; ctx.fillRect(px, py, S, S);
  ctx.globalAlpha = .16; ctx.fillStyle = '#fff';
  for (let q = 0; q < 4; q++) ctx.fillRect(px + ((q * 11 + px) % 25), py + ((q * 7 + py) % 24), 3, 3);
  ctx.globalAlpha = 1;
  if (t === 'grass') { ctx.fillStyle = '#8bd354'; ctx.fillRect(px, py, S, 7); ctx.fillStyle = '#39772e'; ctx.fillRect(px, py + 7, 4, S - 7); }
  if (t === 'wood') { ctx.strokeStyle = '#5e381d'; ctx.strokeRect(px + 6, py + 6, S - 12, S - 12); }
  if (t.endsWith('_ore')) { ctx.fillStyle = t === 'la_peace_ore' ? '#5df7ed' : t === 'diamond_ore' ? '#42e8e0' : t === 'gold_ore' ? '#f5d45a' : t === 'iron_ore' ? '#d5b9a4' : '#252b31'; for (let q = 0; q < 4; q++) ctx.fillRect(px + 6 + (q * 9) % 18, py + 8 + (q * 13) % 17, 5, 5); }
}
function drawMegalodon(m){ const px = m.x - cam; const py = m.y; ctx.save(); ctx.translate(px + m.w / 2, py + m.h / 2); ctx.scale(m.dir, 1); ctx.fillStyle = '#9bd3df'; ctx.beginPath(); ctx.ellipse(0, 0, 28, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#7ab0c7'; ctx.beginPath(); ctx.moveTo(-28, 0); ctx.lineTo(-54, -12); ctx.lineTo(-54, 12); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#f3fbff'; ctx.beginPath(); ctx.arc(10, -4, 3, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(12, -4, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#b6d9e2'; ctx.fillRect(-8, -18, 18, 6); ctx.restore(); }
function drawPlayer(){
  const skin = skinStyles[profile.skin] || skinStyles.steve;
  const x = p.x - cam; const y = p.y;
  ctx.fillStyle = '#000';
  ctx.fillText(profile.name || 'Player', x + p.w / 2 - (profile.name.length || 6) * 2.5, y - 10);
  ctx.fillStyle = '#d3b085'; ctx.fillRect(x + 7, y + 2, 10, 10);
  ctx.fillStyle = skin.shirt; ctx.fillRect(x + 4, y + 12, 15, 18);
  ctx.fillStyle = skin.pants; ctx.fillRect(x + 5, y + 30, 5, 12); ctx.fillRect(x + 13, y + 30, 5, 12);
  ctx.fillStyle = skin.face; ctx.fillRect(x + 7, y + 2, 10, 10);
  ctx.fillStyle = skin.accent; ctx.fillRect(x + 9, y + 5, 2, 2); ctx.fillRect(x + 14, y + 5, 2, 2);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 2, y + 15, 3, 10); ctx.fillRect(x + 18, y + 15, 3, 10);
}
function sky(){ const day = (Math.sin(time * .00012) + 1) / 2; ctx.fillStyle = `rgb(${80 + day * 65},${150 + day * 70},${215 + day * 40})`; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = day > .2 ? '#ffe27a' : '#e5edf5'; ctx.beginPath(); ctx.arc(850, 80, 38, 0, 7); ctx.fill(); }
function hud(){
  ctx.fillStyle = '#101820d9'; ctx.fillRect(c.width / 2 - 250, c.height - 74, 500, 60);
  const hot = blockSlots.slice(0, 9);
  hot.forEach((k, i) => {
    const xx = c.width / 2 - 238 + i * 52; ctx.fillStyle = selected === k ? '#f5c542' : '#38444dcc'; ctx.fillRect(xx, c.height - 64, 46, 46); ctx.fillStyle = data[k][1]; ctx.fillRect(xx + 10, c.height - 54, 26, 26); ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.fillText(i + 1, xx + 4, c.height - 50); ctx.fillText(inv[k] || 0, xx + 29, c.height - 22);
  });
  ctx.fillStyle = '#101820d9'; ctx.fillRect(18, c.height - 74, 210, 60);
  ctx.fillStyle = '#c62828'; ctx.fillRect(30, c.height - 59, 120, 12); ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.fillText('HP ' + p.health + '/100', 38, c.height - 47); ctx.fillStyle = '#d5a52a'; ctx.fillRect(30, c.height - 37, 120, 12); ctx.fillStyle = '#fff'; ctx.fillText('La Peace ' + (inv.la_peace || 0), 38, c.height - 25);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.fillText('Name: ' + (profile.name || 'Player'), c.width - 210, c.height - 52);
  if (profile.email) ctx.fillText('Email: ' + profile.email, c.width - 210, c.height - 37);
}
function draw(){
  sky();
  const a = Math.floor(cam / S) - 2; const b = a + Math.ceil(c.width / S) + 3;
  for (let j = 0; j < H; j++) for (let i = a; i < b; i++) { const t = tile(i, j); if (t !== 'air') drawBlock(i * S - cam, j * S, t); }
  for (const m of mobs) drawMegalodon(m);
  drawPlayer();
  ctx.strokeStyle = '#fff'; ctx.strokeRect(mouse.tx * S - cam + 1, mouse.ty * S + 1, S - 2, S - 2);
  hud();
}
function loop(){ time++; update(); draw(); requestAnimationFrame(loop); }
renderInventory(); renderSkinChoices();
loop();

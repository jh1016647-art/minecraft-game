<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MathCraft 3D</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #87ceeb; font-family: Arial, sans-serif;
    }
    #game { display: block; width: 100vw; height: 100vh; }
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 18px; height: 18px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: #fff; box-shadow: 1px 1px #000;
    }
    #crosshair::before { width: 2px; height: 18px; left: 8px; }
    #crosshair::after { width: 18px; height: 2px; top: 8px; }
    #hud {
      position: fixed; left: 14px; top: 14px; color: #fff; text-shadow: 2px 2px #000;
      font-size: 14px; line-height: 1.5; pointer-events: none;
    }
    #hotbar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; gap: 4px; pointer-events: auto;
    }
    .slot {
      width: 52px; height: 52px; border: 3px solid #555; background: rgba(51,61,61,.78);
      color: #fff; text-align: center; padding: 2px; font-size: 11px;
      user-select: none; cursor: pointer;
    }
    .slot.selected { border-color: #ffd43b; background: rgba(107,87,37,.86); }
    .swatch {
      width: 24px; height: 24px; margin: 2px auto 4px; border: 2px solid #222;
      image-rendering: pixelated; background-size: cover; background-position: center;
    }
    .screen {
      position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.72);
      color: #fff; text-align: center; z-index: 10;
    }
    .screen.hidden { display: none; }
    .card {
      background: rgba(25,33,43,.96); border: 4px solid #7d8791; padding: 28px 30px;
      max-width: 440px; box-shadow: 0 12px 30px rgba(0,0,0,.8);
    }
    .card h1 { margin: 0 0 10px; font-size: 40px; letter-spacing: 4px; text-shadow: 3px 3px #000; }
    .card button {
      padding: 12px 25px; background: #596b7c; color: #fff; border: 2px solid #c9d4df;
      font-weight: bold; cursor: pointer; margin-top: 8px;
    }
    .small { font-size: 13px; color: #d5dde5; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="hud">MathCraft 3D<br>WASD move · Space jump<br>Left click mine · Right click place<br>1–6 select block · Esc unlock mouse</div>
  <div id="hotbar"></div>
  <div id="start" class="screen">
    <div class="card">
      <h1>MATHCRAFT</h1>
      <p>Block world in first-person 3D.</p>
      <p class="small">Click Start, then use the mouse to look around.</p>
      <button id="startButton">Start Game</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x86cffa);
    scene.fog = new THREE.Fog(0x86cffa, 18, 72);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 150);
    const player = new THREE.Object3D();
    const pitch = new THREE.Object3D();
    pitch.add(camera);
    player.add(pitch);
    player.position.set(0, 4, 8);
    scene.add(player);

    const hemi = new THREE.HemisphereLight(0xbde8ff, 0x4a3928, 1.7);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 2.1);
    sun.position.set(-20, 35, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
    scene.add(sun);

    // Minecraft-like block textures through canvas
    function makeTexture(base, detail1, detail2, accent, leaves) {
      const size = 16;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx2 = c.getContext('2d');
      ctx2.fillStyle = base;
      ctx2.fillRect(0, 0, size, size);

      for (let y = 0; y < size; y += 2) {
        for (let x = 0; x < size; x += 2) {
          const v = (x * 13 + y * 7) % 11;
          if (v < 4) {
            ctx2.fillStyle = detail1;
            ctx2.fillRect(x, y, 2, 2);
          } else if (v < 8) {
            ctx2.fillStyle = detail2;
            ctx2.fillRect(x, y, 2, 2);
          }
        }
      }

      if (leaves) {
        for (let i = 0; i < 18; i++) {
          const x = Math.floor(Math.random() * size);
          const y = Math.floor(Math.random() * size);
          ctx2.fillStyle = accent;
          ctx2.fillRect(x, y, 1, 1);
        }
      }

      return c;
    }

    const textureCanvas = {
      grassTop: makeTexture('#5faf3d', '#4d9a35', '#76c858', '#2f7f38', false),
      grassSide: makeTexture('#6c9b42', '#4f7d2a', '#7fb956', '#365d26', false),
      dirt: makeTexture('#87552f', '#7b4925', '#9b6137', '#6a3d22', false),
      stone: makeTexture('#8a8f9a', '#7d828a', '#a1a4a9', '#686d75', false),
      wood: makeTexture('#9b6b38', '#7b512a', '#b1804a', '#5d3b1d', false),
      leaves: makeTexture('#2f813b', '#3f9d42', '#24712f', '#77d964', true),
      glass: makeTexture('#a5edf7', '#7fe0ed', '#c8fcff', '#5edbe8', false)
    };

    const materials = {
      grass: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.grassTop) }),
      grassSide: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.grassSide) }),
      dirt: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.dirt) }),
      stone: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.stone) }),
      wood: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.wood) }),
      leaves: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.leaves), transparent: true, alphaTest: 0.2 }),
      glass: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(textureCanvas.glass), transparent: true, opacity: 0.6 })
    };

    Object.values(materials).forEach(m => m.map.needsUpdate = true);

    const cube = new THREE.BoxGeometry(1, 1, 1);
    const blocks = new Map();
    const keys = {};
    const hot = [
      ['grass', 'Grass'],
      ['dirt', 'Dirt'],
      ['stone', 'Stone'],
      ['wood', 'Wood'],
      ['leaves', 'Leaves'],
      ['glass', 'Glass']
    ];
    let selected = 0;

    const hotbar = document.getElementById('hotbar');
    hot.forEach(([key, label], i) => {
      const el = document.createElement('div');
      el.className = 'slot' + (i === 0 ? ' selected' : '');
      const matKey = key === 'grass' ? 'grass' : key;
      el.innerHTML = '<div class="swatch" style="background-image: url(' + (materials[key === 'grass' ? 'grass' : key].map.image.toDataURL()) + ')"></div>' + label;
      el.onclick = () => select(i);
      hotbar.appendChild(el);
    });

    function select(i) {
      selected = i;
      [...hotbar.children].forEach((el, n) => el.classList.toggle('selected', n === i));
    }

    function addBlock(x, y, z, type) {
      const key = `${x},${y},${z}`;
      if (blocks.has(key)) return;

      const mesh = new THREE.Mesh(cube, materials[type] || materials.stone);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { x, y, z, type };
      scene.add(mesh);
      blocks.set(key, mesh);
    }

    function removeBlock(x, y, z) {
      const key = `${x},${y},${z}`;
      const mesh = blocks.get(key);
      if (!mesh) return;
      scene.remove(mesh);
      blocks.delete(key);
    }

    function terrainHeight(x, z) {
      return 2 + Math.floor(1.7 * Math.sin(x * 0.35) + 1.5 * Math.cos(z * 0.27) + 0.8 * Math.sin((x + z) * 0.19));
    }

    for (let x = -20; x < 20; x++) {
      for (let z = -20; z < 20; z++) {
        const h = Math.max(1, terrainHeight(x, z));
        for (let y = 0; y <= h; y++) {
          const type = y === h ? 'grass' : y > h - 3 ? 'dirt' : 'stone';
          addBlock(x, y, z, type);
        }
        if ((x * 13 + z * 7) % 31 === 0 && h > 2) {
          for (let y = 1; y < 4; y++) addBlock(x, h + y, z, 'wood');
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              for (let dy = 3; dy <= 5; dy++) {
                if (Math.abs(dx) + Math.abs(dz) < 4) addBlock(x + dx, h + dy, z + dz, 'leaves');
              }
            }
          }
        }
      }
    }

    const raycaster = new THREE.Raycaster();
    const center = new THREE.Vector2(0, 0);
    const velocity = new THREE.Vector3();
    let grounded = false;

    function solidAt(x, y, z) {
      return blocks.has(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`);
    }

    function collides(pos) {
      const r = 0.28;
      for (let x = Math.floor(pos.x - r); x <= Math.floor(pos.x + r); x++) {
        for (let y = Math.floor(pos.y); y <= Math.floor(pos.y + 1.7); y++) {
          for (let z = Math.floor(pos.z - r); z <= Math.floor(pos.z + r); z++) {
            if (solidAt(x, y, z)) return true;
          }
        }
      }
      return false;
    }

    function moveAxis(axis, amount) {
      const next = player.position.clone();
      next[axis] += amount;
      if (!collides(next)) {
        player.position[axis] = next[axis];
      } else if (axis === 'y' && amount < 0) {
        grounded = true;
        velocity.y = 0;
      }
    }

    function target() {
      raycaster.setFromCamera(center, camera);
      const hits = raycaster.intersectObjects([...blocks.values()], false);
      return hits[0] || null;
    }

    function mine() {
      const hit = target();
      if (!hit || hit.distance > 6) return;
      const { x, y, z } = hit.object.userData;
      removeBlock(x, y, z);
    }

    function place() {
      const hit = target();
      if (!hit || hit.distance > 6) return;
      const normal = hit.face.normal;
      const base = hit.object.userData;
      const x = base.x + normal.x;
      const y = base.y + normal.y;
      const z = base.z + normal.z;
      if (!solidAt(x, y, z)) addBlock(x, y, z, hot[selected][0]);
    }

    addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code.startsWith('Digit')) {
        const n = Number(e.code.slice(5)) - 1;
        if (n >= 0 && n < hot.length) select(n);
      }
      if (e.code === 'Space' && grounded) {
        velocity.y = 7;
        grounded = false;
      }
    });

    addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    canvas.addEventListener('mousedown', (e) => {
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
        return;
      }
      if (e.button === 0) mine();
      if (e.button === 2) place();
    });

    canvas.oncontextmenu = (e) => e.preventDefault();

    addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      player.rotation.y -= e.movementX * 0.0025;
      pitch.rotation.x = Math.max(-1.45, Math.min(1.45, pitch.rotation.x - e.movementY * 0.0025));
    });

    document.getElementById('startButton').onclick = () => {
      document.getElementById('start').classList.add('hidden');
      canvas.requestPointerLock();
    };

    addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const last = { t: performance.now() };
    function animate(now) {
      const dt = Math.min(0.05, (now - last.t) / 1000);
      last.t = now;

      const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      const speed = 5;
      const dir = new THREE.Vector3(side, 0, -forward).normalize();
      dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);

      moveAxis('x', dir.x * speed * dt);
      moveAxis('z', dir.z * speed * dt);

      velocity.y -= 18 * dt;
      moveAxis('y', velocity.y * dt);

      if (player.position.y < 1) {
        player.position.y = 1;
        velocity.y = 0;
        grounded = true;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MathCraft 3D</title>
  <style>
    :root {
      --hud-bg: rgba(19,27,35,.7);
      --panel-bg: rgba(14,20,28,.95);
      --slot-bg: rgba(72,79,86,.85);
      --slot-selected: rgba(122,102,34,.95);
      --accent: #ffd34e;
      --white: #fff;
      --muted: #dfe7f2;
      --line: rgba(255,255,255,.14);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #88d0ff; font-family: Arial, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 18px; height: 18px; pointer-events: none; z-index: 20;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,.95);
      box-shadow: 1px 1px rgba(0,0,0,.75);
    }
    #crosshair::before { left: 8px; width: 2px; height: 18px; }
    #crosshair::after { top: 8px; width: 18px; height: 2px; }

    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 25; color: var(--white);
      text-shadow: 2px 2px #000; font-size: 14px; line-height: 1.45;
      padding: 8px 10px; background: var(--hud-bg); border: 2px solid var(--line);
      border-radius: 4px; pointer-events: none;
    }

    #hotbar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; gap: 4px; z-index: 30; user-select: none;
    }
    .slot {
      width: 54px; height: 54px; background: var(--slot-bg); border: 3px solid #4a4d52;
      color: white; border-radius: 4px; text-align: center; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; padding: 2px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .slot.selected {
      border-color: var(--accent); background: var(--slot-selected);
      box-shadow: 0 0 10px rgba(255, 211, 78, 0.3);
    }
    .slot-swatch {
      width: 24px; height: 24px; margin-bottom: 2px; border: 2px solid rgba(0,0,0,.4);
      background-size: cover; background-position: center; image-rendering: pixelated;
    }

    #startScreen {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 40;
      background: rgba(0,0,0,.75);
    }
    #startScreen.hidden { display: none; }
    .card {
      width: min(460px, 90vw); background: rgba(18,25,33,.96);
      border: 4px solid #7d8791; box-shadow: 0 12px 32px rgba(0,0,0,.8);
      color: white; padding: 26px 28px; text-align: center;
    }
    .card h1 {
      margin: 0 0 12px; font-size: clamp(34px, 6vw, 52px); letter-spacing: 4px;
      text-shadow: 3px 3px #000;
    }
    .card p { margin: 8px 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .card button {
      margin-top: 12px; background: #596b7c; color: white; border: 2px solid #dce7f5;
      padding: 12px 24px; font-weight: bold; cursor: pointer;
    }

    #inventory {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(620px, 90vw); background: var(--panel-bg); border: 4px solid #7a7a7a;
      box-shadow: 0 15px 35px rgba(0,0,0,.8); padding: 16px; display: none; z-index: 35;
    }
    #inventory.open { display: block; }
    #inventory h2 { margin: 0 0 12px; text-align: center; color: white; }
    .inv-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px;
    }
    .inv-item {
      min-height: 78px; background: #2b3139; border: 2px solid #6d6d6d; color: white;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; text-align: center; font-size: 12px;
    }
    .inv-item.highlight { border-color: var(--accent); }
    .close-inv {
      display: block; margin: 14px auto 0; background: #53667d; color: white;
      border: 2px solid #dfeaf9; padding: 8px 18px; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>

  <div id="hud">
    MathCraft 3D<br>
    Health: <span id="healthText">100</span><br>
    WASD move · Space jump<br>
    Left click mine · Right click place<br>
    1–6 select block · E inventory · Esc unlock mouse
  </div>

  <div id="hotbar"></div>

  <div id="startScreen">
    <div class="card">
      <h1>MATHCRAFT</h1>
      <p>First-person block world with Minecraft-inspired visuals.</p>
      <p class="muted">Click Start Game then use the mouse to look around.</p>
      <button id="startButton">Start Game</button>
    </div>
  </div>

  <div id="inventory">
    <h2>Inventory</h2>
    <div id="inventoryGrid" class="inv-grid"></div>
    <button id="closeInventory" class="close-inv">Close</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8bd0ff);
    scene.fog = new THREE.Fog(0x8bd0ff, 18, 72);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 200);
    const player = new THREE.Object3D();
    const pitch = new THREE.Object3D();
    pitch.add(camera);
    player.add(pitch);
    player.position.set(0, 8, 6);
    scene.add(player);

    const hemi = new THREE.HemisphereLight(0xcbeeff, 0x3d2f1f, 1.45);
    scene.add(hemi);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.7);
    sunLight.position.set(-20, 28, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    sunLight.shadow.camera.left = -32; sunLight.shadow.camera.right = 32;
    sunLight.shadow.camera.top = 32; sunLight.shadow.camera.bottom = -32;
    scene.add(sunLight);

    const WORLD_MIN = -20;
    const WORLD_MAX = 20;
    const WATER_LEVEL = 3;
    const blocks = new Map();
    const mobs = [];
    const keys = {};

    const playerState = {
      health: 100,
      velocity: new THREE.Vector3(),
      grounded: false,
      selected: 0,
      inventory: {
        grass: 24,
        dirt: 20,
        stone: 18,
        wood: 12,
        leaves: 10,
        water: 10,
        glass: 6
      }
    };

    const hotbarItems = [
      { key: 'grass', label: 'Grass' },
      { key: 'dirt', label: 'Dirt' },
      { key: 'stone', label: 'Stone' },
      { key: 'wood', label: 'Wood' },
      { key: 'leaves', label: 'Leaves' },
      { key: 'water', label: 'Water' }
    ];

    function randomNoise(x, z) {
      return Math.sin(x * 0.72 + z * 0.91) * 1.5 + Math.cos(z * 0.63 - x * 0.49) * 1.7 + Math.sin((x + z) * 0.23) * 0.8;
    }

    function terrainHeight(x, z) {
      return Math.max(1, Math.floor(4 + randomNoise(x, z)));
    }

    function makeTexture(base, detail1, detail2, accent, leaves = false) {
      const size = 16;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, size, size);

      for (let y = 0; y < size; y += 2) {
        for (let x = 0; x < size; x += 2) {
          const v = (x * 13 + y * 7) % 11;
          if (v < 3) { ctx.fillStyle = detail1; ctx.fillRect(x, y, 2, 2); }
          else if (v < 7) { ctx.fillStyle = detail2; ctx.fillRect(x, y, 2, 2); }
        }
      }

      if (leaves) {
        for (let i = 0; i < 24; i++) {
          const x = Math.floor(Math.random() * size);
          const y = Math.floor(Math.random() * size);
          ctx.fillStyle = accent; ctx.fillRect(x, y, 1, 1);
        }
      }
      return c;
    }

    const texGen = {
      grassTop: makeTexture('#58b148', '#3b8f32', '#79d55c', '#246626', false),
      grassSide: makeTexture('#6c9c49', '#4b7d2d', '#7bbd58', '#395a2d', false),
      dirt: makeTexture('#89552d', '#764724', '#a96939', '#5a3417', false),
      stone: makeTexture('#8d939a', '#77808a', '#abafb7', '#5f6874', false),
      wood: makeTexture('#9a6c3c', '#7d5026', '#be8758', '#5f3b1d', false),
      leaves: makeTexture('#2d8d3a', '#3aa845', '#1e6d2d', '#88e173', true),
      glass: makeTexture('#bfeeff', '#8fe5ff', '#effcff', '#75dae8', false),
      water: makeTexture('#4fa9ff', '#3d97ff', '#82c7ff', '#7bc1ff', false)
    };

    const materials = {
      grass: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.grassTop) }),
      dirt: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.dirt) }),
      stone: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.stone) }),
      wood: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.wood) }),
      leaves: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.leaves), transparent: true, alphaTest: 0.2 }),
      glass: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.glass), transparent: true, opacity: 0.7 }),
      water: new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texGen.water), transparent: true, opacity: 0.7 })
    };

    Object.values(materials).forEach(m => m.map.needsUpdate = true);

    const cubeGeom = new THREE.BoxGeometry(1, 1, 1);

    function renderHotbar() {
      const hotbar = document.getElementById('hotbar');
      hotbar.innerHTML = '';
      hotbarItems.forEach((item, index) => {
        const slot = document.createElement('div');
        slot.className = 'slot' + (playerState.selected === index ? ' selected' : '');
        const tex = materials[item.key].map.image.toDataURL();
        slot.innerHTML = '<div class="slot-swatch" style="background-image:url(' + tex + ')"></div>' + item.label;
        slot.onclick = () => { playerState.selected = index; renderHotbar(); };
        hotbar.appendChild(slot);
      });
    }

    function addBlock(x, y, z, type) {
      const key = `${x},${y},${z}`;
      if (blocks.has(key)) return;
      if (type === 'water' && y > WATER_LEVEL + 2) return;

      const mesh = new THREE.Mesh(cubeGeom, materials[type] || materials.stone);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.userData = { x, y, z, type };
      scene.add(mesh);
      blocks.set(key, mesh);
    }

    function removeBlock(x, y, z) {
      const key = `${x},${y},${z}`;
      const mesh = blocks.get(key);
      if (!mesh) return;
      scene.remove(mesh);
      blocks.delete(key);
    }

    function blockAt(x, y, z) {
      return blocks.get(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`);
    }

    function solidAt(x, y, z) {
      const b = blockAt(x, y, z);
      return !!b && b.userData.type !== 'water';
    }

    function shouldCarve(x, y, z, base) {
      const cave = Math.sin(x * 0.95 + z * 0.8 + y * 0.9) > 0.15 && Math.cos(z * 0.8 - x * 0.7) > -0.25;
      return y < base - 2 && cave;
    }

    function buildTerrain() {
      const set = new Set();
      for (let x = WORLD_MIN; x <= WORLD_MAX; x++) {
        for (let z = WORLD_MIN; z <= WORLD_MAX; z++) {
          const h = terrainHeight(x, z);
          for (let y = 0; y <= h; y++) {
            const type = y === h ? 'grass' : y > h - 3 ? 'dirt' : 'stone';
            if (!shouldCarve(x, y, z, h) || y <= 1) {
              set.add(`${x},${y},${z},${type}`);
            }
          }

          for (let y = h + 1; y <= WATER_LEVEL; y++) {
            set.add(`${x},${y},${z},water`);
          }

          if ((x * 19 + z * 7) % 17 === 0 && h >= 2 && Math.abs(x) > 3 && Math.abs(z) > 3) {
            const trunkHeight = 3 + ((x * z) % 3);
            for (let ty = h + 1; ty <= h + trunkHeight; ty++) {
              set.add(`${x},${ty},${z},wood`);
            }
            for (let dx = -2; dx <= 2; dx++) {
              for (let dz = -2; dz <= 2; dz++) {
                for (let dy = 0; dy <= 2; dy++) {
                  const d = Math.abs(dx) + Math.abs(dz) + Math.abs(dy);
                  if (d <= 4 && !(dx === 0 && dz === 0 && dy === 0)) {
                    set.add(`${x + dx},${h + trunkHeight - 1 + dy},${z + dz},leaves`);
                  }
                }
              }
            }
          }
        }
      }

      for (const entry of set) {
        const parts = entry.split(',');
        const x = Number(parts[0]);
        const y = Number(parts[1]);
        const z = Number(parts[2]);
        const type = parts[3];
        addBlock(x, y, z, type);
      }
    }

    function removeFloatingLeaves() {
      for (const [key, mesh] of [...blocks.entries()]) {
        const { x, y, z, type } = mesh.userData;
        if (type === 'leaves' && !blockAt(x, y - 1, z)) {
          removeBlock(x, y, z);
        }
      }
    }

    buildTerrain();
    removeFloatingLeaves();

    function spawnMob(x, z, flavor = 'slime') {
      const color = flavor === 'slime' ? 0x6fdc66 : 0xc9b299;
      const mob = {
        x, y: 6, z, vx: 0, vy: 0, vz: 0, health: flavor === 'slime' ? 25 : 35, cooldown: 0,
        mesh: new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshLambertMaterial({ color })),
        flavor
      };
      mob.mesh.position.set(x, mob.y + 0.45, z);
      mob.mesh.castShadow = true; mob.mesh.receiveShadow = true;
      scene.add(mob.mesh);
      mobs.push(mob);
    }

    for (let i = 0; i < 10; i++) {
      const x = -12 + (i * 4) % 25;
      const z = -15 + (i * 3) % 22;
      const flavor = i % 2 === 0 ? 'slime' : 'zombie';
      spawnMob(x, z, flavor);
    }

    function updateInventoryDisplay() {
      const inv = document.getElementById('inventoryGrid');
      inv.innerHTML = '';
      const order = ['grass', 'dirt', 'stone', 'wood', 'leaves', 'water', 'glass'];
      order.forEach((key) => {
        const item = document.createElement('div');
        item.className = 'inv-item' + (hotbarItems[playerState.selected]?.key === key ? ' highlight' : '');
        const tex = materials[key].map.image.toDataURL();
        item.innerHTML = '<div class="slot-swatch" style="background-image:url(' + tex + ')"></div>' + (key[0].toUpperCase() + key.slice(1)) + '<br>' + (playerState.inventory[key] || 0);
        inv.appendChild(item);
      });
    }

    function setInventoryOpen(open) {
      document.getElementById('inventory').classList.toggle('open', open);
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(0, 0);

    function getTargetBlock() {
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects([...blocks.values()], false);
      return hits[0] || null;
    }

    function mineSelected() {
      const hit = getTargetBlock();
      if (!hit || hit.distance > 6) return;
      const { x, y, z, type } = hit.object.userData;
      removeBlock(x, y, z);
      if (type === 'grass') playerState.inventory.grass = (playerState.inventory.grass || 0) + 1;
      if (type === 'dirt') playerState.inventory.dirt = (playerState.inventory.dirt || 0) + 1;
      if (type === 'stone') playerState.inventory.stone = (playerState.inventory.stone || 0) + 1;
      if (type === 'wood') playerState.inventory.wood = (playerState.inventory.wood || 0) + 1;
      if (type === 'leaves') playerState.inventory.leaves = (playerState.inventory.leaves || 0) + 1;
      if (type === 'water') playerState.inventory.water = (playerState.inventory.water || 0) + 1;
      updateInventoryDisplay();
    }

    function placeSelected() {
      const hit = getTargetBlock();
      if (!hit || hit.distance > 6) return;
      const normal = hit.face.normal;
      const base = hit.object.userData;
      const nx = base.x + normal.x;
      const ny = base.y + normal.y;
      const nz = base.z + normal.z;
      const key = hotbarItems[playerState.selected].key;
      if (solidAt(nx, ny, nz)) return;
      if ((playerState.inventory[key] || 0) <= 0) return;
      playerState.inventory[key] -= 1;
      addBlock(nx, ny, nz, key);
      updateInventoryDisplay();
    }

    function collidesWithWorld(pos, radius = 0.28) {
      for (let x = Math.floor(pos.x - radius); x <= Math.floor(pos.x + radius); x++) {
        for (let y = Math.floor(pos.y); y <= Math.floor(pos.y + 1.8); y++) {
          for (let z = Math.floor(pos.z - radius); z <= Math.floor(pos.z + radius); z++) {
            if (solidAt(x, y, z)) return true;
          }
        }
      }
      return false;
    }

    function updatePlayer(delta) {
      const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      const strafe = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      const move = new THREE.Vector3(strafe, 0, -forward).normalize();
      move.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);

      const speed = 5.2;
      const nextX = player.position.clone();
      nextX.x += move.x * speed * delta;
      if (!collidesWithWorld(nextX)) player.position.x = nextX.x;

      const nextZ = player.position.clone();
      nextZ.z += move.z * speed * delta;
      if (!collidesWithWorld(nextZ)) player.position.z = nextZ.z;

      playerState.velocity.y -= 18 * delta;
      const nextY = player.position.clone();
      nextY.y += playerState.velocity.y * delta;
      if (!collidesWithWorld(nextY)) {
        player.position.y = nextY.y;
        playerState.grounded = false;
      } else {
        if (playerState.velocity.y < 0) playerState.grounded = true;
        playerState.velocity.y = 0;
      }

      if (keys.Space && playerState.grounded) {
        playerState.velocity.y = 7.8;
        playerState.grounded = false;
      }

      if (player.position.y < 1.6) {
        player.position.y = 1.6;
        playerState.velocity.y = 0;
        playerState.grounded = true;
      }
    }

    function updateMobs(delta) {
      for (const mob of mobs) {
        const dx = player.position.x - mob.x;
        const dz = player.position.z - mob.z;
        const dist = Math.hypot(dx, dz) || 1;

        if (dist < 8) {
          mob.x += (dx / dist) * 0.9 * delta;
          mob.z += (dz / dist) * 0.9 * delta;
        } else {
          mob.x += Math.sin((performance.now() * 0.001) + mob.x) * 0.35 * delta;
          mob.z += Math.cos((performance.now() * 0.001) + mob.z) * 0.35 * delta;
        }

        mob.mesh.position.set(mob.x, 1.1 + Math.sin(performance.now() * 0.004 + mob.x) * 0.1, mob.z);

        if (dist < 1.5 && mob.cooldown <= 0) {
          playerState.health = Math.max(0, playerState.health - 10);
          mob.cooldown = 1.1;
          if (playerState.health <= 0) {
            playerState.health = 100;
            player.position.set(0, 8, 6);
          }
        }
        mob.cooldown = Math.max(0, mob.cooldown - delta);
      }
    }

    const clock = new THREE.Clock();
    let dayTime = 0.25;

    function updateSkyAndLights(delta) {
      dayTime += delta * 0.045;
      if (dayTime > 1) dayTime -= 1;
      const ang = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(ang);
      const sunlightX = Math.cos(ang) * 28;
      sunLight.position.set(sunlightX, 20 + sunHeight * 30, 14);
      const daylight = Math.max(0.15, (sunHeight + 1) / 2);
      const sky = new THREE.Color().setHSL(0.59, 0.72, 0.6 + daylight * 0.2);
      scene.background = sky;
      scene.fog.color.copy(sky);
      renderer.setClearColor(sky, 1);
      sunLight.intensity = 0.2 + daylight * 1.8;
      hemi.intensity = 0.35 + daylight * 0.8;
    }

    function updateHUD() {
      document.getElementById('healthText').textContent = Math.max(0, Math.round(playerState.health));
    }

    function loop() {
      const delta = Math.min(0.05, clock.getDelta());
      updateSkyAndLights(delta);
      updatePlayer(delta);
      updateMobs(delta);
      updateHUD();
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code.startsWith('Digit')) {
        const idx = Number(e.code.slice(5)) - 1;
        if (idx >= 0 && idx < hotbarItems.length) {
          playerState.selected = idx;
          renderHotbar();
        }
      }

      if (e.code === 'KeyE') {
        const inv = document.getElementById('inventory');
        inv.classList.toggle('open');
      }

      if (e.code === 'Space' && playerState.grounded) {
        playerState.velocity.y = 7.8;
        playerState.grounded = false;
      }
    });

    addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    canvas.addEventListener('mousedown', (e) => {
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
        return;
      }
      if (e.button === 0) mineSelected();
      if (e.button === 2) placeSelected();
    });
    canvas.oncontextmenu = e => e.preventDefault();

    addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      player.rotation.y -= e.movementX * 0.0025;
      pitch.rotation.x = Math.max(-1.45, Math.min(1.45, pitch.rotation.x - e.movementY * 0.0025));
    });

    document.getElementById('startButton').onclick = () => {
      document.getElementById('startScreen').classList.add('hidden');
      canvas.requestPointerLock();
    };

    document.getElementById('closeInventory').onclick = () => {
      setInventoryOpen(false);
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderHotbar();
    updateInventoryDisplay();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
